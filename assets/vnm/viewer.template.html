<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GOGO_VIEW_TITLE</title>
  <!-- gogo interactive viewer · self-contained · offline (file://) · vendored assets only, no network -->
  <link rel="stylesheet" href="GOGO_VIEWER_CSS" />
</head>
<body>
  <main class="report">
    <!-- summary slot: plan.md / report.md pre-rendered to readable HTML (no JS md lib) -->
    <article class="summary">
GOGO_VIEW_SUMMARY
    </article>

    <!-- diagrams slot: one figure per .mmd; viewer.js mounts each with very-nice-mermaid -->
    <section class="diagrams">
GOGO_VIEW_DIAGRAMS
    </section>
  </main>

  <!-- Prebuilt layouts from assets/vnm/layout.mjs, keyed by diagram basename.
       Required for sequence / class / state (routing raw DSL for those needs
       mermaid's detectType, a dynamic import file:// blocks); flowcharts can
       fall back to parsing the inline DSL. `{}` = none available. -->
  <script>window.GOGO_LAYOUTS = GOGO_VIEW_LAYOUTS;</script>
  <!-- committed node positions (from <name>.layout.json); `{}` when none -->
  <script>window.GOGO_LAYOUT = GOGO_VIEW_LAYOUT;</script>

  <!-- Vendored very-nice-mermaid, then the orchestrator - ORDERED classic script
       tags at end of body (ES modules and fetch are blocked over file://; the
       bundle attaches to window.vnm). -->
  <script src="GOGO_VNM_SRC"></script>
  <script src="GOGO_VIEWER_SRC"></script>
</body>
</html>
